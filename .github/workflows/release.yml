# SPDX-License-Identifier: Apache-2.0
# Steps 6-8 of docs/releases.md, run from the tag instead of by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "123456:CITOKEN1234567890"
      BOT_USERNAME: quoto_ci_bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tag on the branch its channel is published from
        # docs/versioning.md: pre-releases are tagged on dev, stable releases on
        # main. A stable tag that never went through main would publish
        # something the production branch has not seen.
        run: |
          if printf '%s' "${GITHUB_REF_NAME}" | grep -Eq -- '-(alpha|beta|rc)\.'; then
            branch=dev
          else
            branch=main
          fi
          git fetch --no-tags origin "${branch}:refs/remotes/origin/${branch}"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${branch}"; then
            echo "tag ${GITHUB_REF_NAME} is not an ancestor of origin/${branch}"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q tests

      - name: Require a changelog section for this tag
        run: |
          grep -qE "^## ${GITHUB_REF_NAME}( |$)" CHANGELOG.md \
            || { echo "CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section"; exit 1; }

  release:
    name: Publish image and release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release metadata
        id: meta
        run: |
          version="${GITHUB_REF_NAME}"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
          # A pre-release suffix (-alpha/-beta/-rc) is never tagged "latest".
          if printf '%s' "${version}" | grep -Eq -- '-(alpha|beta|rc)\.'; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Lowercase image name
        id: image
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME}"
          notes_file="$(mktemp)"
          # Match by literal prefix AND a boundary, so "## v0.10.3" does not
          # capture "## v0.10.3-alpha.1".
          awk -v ver="## ${version}" '
            index($0, ver) == 1 && (length($0) == length(ver) || substr($0, length(ver) + 1, 1) == " ") { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md >"${notes_file}"
          # The verify job already refused a tag with no section, so an empty
          # file here means the awk above stopped matching, not a missing entry.
          if [ ! -s "${notes_file}" ]; then
            echo "changelog section for ${version} extracted empty"
            exit 1
          fi
          echo "file=${notes_file}" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.repo }}:${{ steps.meta.outputs.version }}
          build-args: |
            QUOTO_VERSION=${{ steps.meta.outputs.version }}
            QUOTO_REVISION=${{ github.sha }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            flags="--prerelease"
          fi
          # Idempotent: update an existing release (manual, or a re-run),
          # otherwise create it.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${{ steps.changelog.outputs.file }}" ${flags}
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${{ steps.changelog.outputs.file }}" ${flags}
          fi
