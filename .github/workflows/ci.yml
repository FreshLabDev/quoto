# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # tests/__init__.py sets these too, but alembic loads app.models -> app.config,
  # which validates settings at import time and exits if they are missing.
  BOT_TOKEN: "123456:CITOKEN1234567890"
  BOT_USERNAME: quoto_ci_bot

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Every direct dependency is pinned in requirements.txt
        # requirements.in is the intent, requirements.txt is what installs. A
        # package added to the first and never compiled into the second is a
        # dependency the container will not have.
        run: |
          missing=0
          while read -r pkg; do
            case "$pkg" in ''|'#'*) continue ;; esac
            name=$(printf '%s' "$pkg" | sed 's/[<>=!~;[].*//' | tr -d '[:space:]')
            [ -z "$name" ] && continue
            grep -qiE "^${name}(\[|==)" requirements.txt || {
              echo "missing from requirements.txt: ${name}"; missing=1; }
          done < requirements.in
          exit "$missing"

      - name: Compile all sources
        run: python -m compileall -q app tests scripts main.py healthcheck.py

      - name: Test
        run: python -m pytest -q tests

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql+asyncpg://quoto:quoto@localhost:5432/quoto
      PGPASSWORD: quoto
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quoto
          POSTGRES_PASSWORD: quoto
          POSTGRES_DB: quoto
        options: >-
          --health-cmd "pg_isready -U quoto"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reject a branched migration history
        # Two heads mean two migrations claim the same parent. Alembic then
        # refuses to upgrade on the host, after the deploy has already started.
        run: |
          heads=$(alembic heads | grep -c . || true)
          if [ "$heads" -ne 1 ]; then
            echo "expected exactly one alembic head, found ${heads}:"
            alembic heads
            exit 1
          fi

      - name: Seed the shared core schema
        # Production applies these from the core repository. deploy/core-init.sql
        # is the verbatim copy quoto's foreign keys need to exist first.
        run: psql -h localhost -U quoto -d quoto -v ON_ERROR_STOP=1 -f deploy/core-init.sql

      - name: Upgrade, step back down, upgrade again
        # A migration that cannot be undone is a migration that cannot be rolled
        # back on the host either.
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  image:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t quoto:ci .

      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
