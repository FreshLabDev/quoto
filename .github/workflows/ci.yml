# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Weekly, so a new advisory against a dependency or the standard library is
  # noticed while nothing is being pushed.
  schedule:
    - cron: "23 5 * * 1"
  # release.yml runs this before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: No local replace in go.mod
        # A replace points at a checkout on one machine. It builds there and
        # nowhere else, the Docker build included.
        run: |
          if grep -nE '^\s*replace\b' go.mod; then
            echo "go.mod has a replace directive; release the module it points at and require the tag"
            exit 1
          fi
      - name: Verify modules
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  database:
    name: Database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quoto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d quoto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run database tests
        # Every integration test drops and recreates schema quoto, so the
        # packages must not run at the same time.
        env:
          QUOTO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/quoto_test?sslmode=disable
        run: go test -tags=integration -race -p 1 ./...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  image:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t quoto:ci .
      - name: Validate Compose
        run: |
          cp .env.example .env
          QUOTO_IMAGE=ghcr.io/freshlabdev/quoto:test \
            QUOTO_CORE_PASSWORD=ci-validation-only \
            docker compose -f deploy/ws04/compose.yaml config >/dev/null
          docker compose -f deploy/ws04/compose.test.yaml config >/dev/null
